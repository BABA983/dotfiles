[general]
import = [
"./flexoki-dark.toml"
#"./color-bak.toml"
]

[cursor.style]
blinking = "Never"

[font]
size = 16.0
normal = { family = "JetBrains Maple Mono" }
glyph_offset = { x = 0, y = 0 }

[[keyboard.bindings]]
action = "Paste"
key = "V"
mods = "Control|Shift"

[[keyboard.bindings]]
action = "Copy"
key = "C"
mods = "Control|Shift"

[[keyboard.bindings]]
action = "ResetFontSize"
key = "Key0"
mods = "Control"

[[keyboard.bindings]]
action = "IncreaseFontSize"
key = "Equals"
mods = "Control"

[[keyboard.bindings]]
action = "DecreaseFontSize"
key = "Minus"
mods = "Control"

[window]
blur = true
decorations = "Buttonless"
dynamic_title = true
dynamic_padding = true
padding = { x = 2, y = 2 }
resize_increments = true

[selection]
save_to_clipboard = true
semantic_escape_chars = ",‚îÇ`|:\"' ()[]{}<>"
